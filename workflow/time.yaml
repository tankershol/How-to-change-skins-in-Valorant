name: 463 commits

on:
  workflow_dispatch:

jobs:
  make-commits:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create 463 commits
        run: |
          mkdir -p info
          touch info/voteanumber.txt

          for i in $(seq 1 463); do
            echo "$i" >> info/voteanumber.txt

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add info/voteanumber.txt
            git commit -m "Vote number $i"
            git push origin HEAD:${GITHUB_REF_NAME}
          done
